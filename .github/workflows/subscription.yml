name: Build VLESS Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source
        run: |
          set -e

          rm -rf source

          git clone --depth 1 \
            https://github.com/VP01596/vless-top15.git \
            source

      - name: Collect all VLESS links
        run: |
          set -e

          : > subscription.txt

          find source \
            -type f \
            -name "*.txt" \
            -print0 |
          while IFS= read -r -d '' file
          do
            echo "Reading: $file"

            grep -oE 'vless://[^[:space:]]+' "$file" \
              >> subscription.txt || true
          done

          sed -i 's/\r$//' subscription.txt

          sort -u subscription.txt -o subscription.txt

          COUNT=$(grep -c '^vless://' subscription.txt || true)

          echo "TOTAL VLESS LINKS: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No VLESS links found!"
            exit 1
          fi

      - name: Create Base64 subscription
        run: |
          set -e

          base64 -w 0 subscription.txt > subscription_base64.txt
          echo >> subscription_base64.txt

          echo "BASE64 SUBSCRIPTION CREATED"

      - name: Commit subscription
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.txt subscription_base64.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update VLESS subscription"
            git push
          fi
