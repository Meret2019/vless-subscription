name: Build VLESS Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source repository
        run: |
          set -e

          rm -rf source
          mkdir -p source

          git clone --depth 1 \
            https://github.com/VP01596/vless-top15.git \
            source/vless-top15

          echo "Source repository downloaded."

      - name: Find all TXT files
        run: |
          echo "TXT files:"

          find source/vless-top15 \
            -type f \
            -iname "*.txt" \
            -print

      - name: Collect all VLESS links
        run: |
          set -e

          : > subscription.txt

          find source/vless-top15 \
            -type f \
            -iname "*.txt" \
            -print0 |
          while IFS= read -r -d '' file
          do
            echo "Reading: $file"

            # Remove BOM, CR and leading spaces
            sed 's/\r//g; s/^[[:space:]]*//' "$file" |
            grep -oE 'vless://[^[:space:]]+' \
            >> subscription.txt || true

          done

          sort -u subscription.txt -o subscription.txt

          COUNT=$(grep -c '^vless://' subscription.txt || true)

          echo "================================="
          echo "TOTAL VLESS: $COUNT"
          echo "================================="

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No VLESS links found."
            echo "Showing sample source content:"
            find source/vless-top15 \
              -type f \
              -iname "*.txt" \
              -print -quit |
              xargs -r head -n 20
            exit 1
          fi

      - name: Create Base64 subscription
        run: |
          set -e

          base64 -w 0 subscription.txt > subscription_base64.txt

          echo >> subscription_base64.txt

          echo "Subscription created successfully."

      - name: Commit subscription
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.txt subscription_base64.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto update VLESS subscription"
            git push
          fi
